name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.7", "1.27.0"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Check formatting
        run: |
          gofmt -w .
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Build commands
        run: go build -o /tmp/orbit-bin/ ./cmd/...

  cpp:
    name: C++20 sanitizers
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build
      - name: Configure
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize
      - name: Test
        run: ctest --preset sanitize

  postgres:
    name: PostgreSQL 18.6 integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: orbit
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORBIT_TEST_DATABASE_URL: postgres://orbit:orbit@127.0.0.1:5432/orbit?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: false
      - name: Verify migrations are reversible
        run: |
          go run ./cmd/orbit-migrate -direction up -database-url "$ORBIT_TEST_DATABASE_URL"
          go run ./cmd/orbit-migrate -direction down -steps 1 -database-url "$ORBIT_TEST_DATABASE_URL"
          go run ./cmd/orbit-migrate -direction up -database-url "$ORBIT_TEST_DATABASE_URL"
      - name: Run PostgreSQL integration tests
        run: go test -race -count=1 ./internal/storage/...
      - name: Run process-level online smoke tests
        run: go test -race -count=1 -timeout 5m ./internal/processtest/...
      - name: Run scenario runner integration tests
        run: go test -race -count=1 -timeout 10m ./internal/scenariorunner/...

  repository:
    name: Repository contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: false
      - name: Validate JSON syntax
        run: |
          find scenarios -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool >/dev/null
      - name: Verify scenario contract
        run: |
          go run ./cmd/scenario-check ./scenarios/examples/offline-reconnect.v1.json
          go run ./cmd/scenario-check ./scenarios/examples/online-smoke.v1.json
          go run ./cmd/scenario-check ./scenarios/examples/dual-gateway-session.v1.json
          go run ./cmd/scenario-check ./scenarios/examples/gateway-crash-before-send.v1.json
          go run ./cmd/scenario-check ./scenarios/examples/gateway-crash-after-send.v1.json
          go test ./internal/scenario -run TestCompileScheduleMatchesGoldenFixture -count=1
          if go run ./cmd/scenario-check ./scenarios/invalid/unknown-device.v1.json; then
            echo "::error::the invalid scenario fixture was accepted" >&2
            exit 1
          fi
      - name: Verify benchmark config
        run: go run ./cmd/benchmark-check ./benchmarks/b0-harness-calibration.v1.json
      - name: Check whitespace errors
        run: git diff --check
