# Orbit E1 — bring-up and interrupt acquisition

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=0

CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Bounded acquisition queue depth (static allocation).
CONFIG_ORBIT_ACQ_QUEUE_DEPTH=64
CONFIG_ORBIT_IMU_LOG_LEVEL=3

# E1 demo: 5 s polling baseline, then 10 s ISR path.
CONFIG_ORBIT_E1_POLL_DURATION_SEC=5
CONFIG_ORBIT_E1_ISR_DURATION_SEC=10
