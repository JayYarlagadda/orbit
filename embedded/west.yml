# Orbit embedded west workspace manifest.
# Initialize from this directory:
#   west init -l .
#   west update
manifest:
  version: "0.13"

  defaults:
    remote: zephyrproject

  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject
      revision: v3.7.0
      import: true

  self:
    path: .
