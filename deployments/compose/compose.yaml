name: orbit

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      # PostgreSQL 18+ images store data in a major-version subdirectory and
      # reject a mount at /var/lib/postgresql/data. See docker-library/postgres#1259.
      - orbit-postgres:/var/lib/postgresql
    restart: unless-stopped

volumes:
  orbit-postgres:
