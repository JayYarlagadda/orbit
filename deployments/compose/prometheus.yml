global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: orbitd
    static_configs:
      - targets: ["host.docker.internal:9090"]
  - job_name: orbit-gateway
    static_configs:
      - targets: ["host.docker.internal:9092"]
  - job_name: orbit-client
    static_configs:
      - targets: ["host.docker.internal:9093"]
