apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: orbit
  labels:
    app.kubernetes.io/name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      containers:
        - name: gateway
          image: orbit/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
              name: grpc
            - containerPort: 9092
              name: metrics
          envFrom:
            - configMapRef:
                name: orbit-config
          env:
            - name: ORBIT_GATEWAY_LISTEN_ADDRESS
              value: "0.0.0.0:50052"
            - name: ORBIT_METRICS_ADDRESS
              value: "0.0.0.0:9092"
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: orbit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
      nodePort: 30552
    - name: metrics
      port: 9092
      targetPort: 9092
