apiVersion: batch/v1
kind: Job
metadata:
  name: orbit-migrate
  namespace: orbit
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: orbit/orbit-migrate:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ORBIT_DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: orbit-config
                  key: ORBIT_DATABASE_URL
          command: ["/orbit", "-direction", "up", "-directory", "/migrations"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitd
  namespace: orbit
  labels:
    app.kubernetes.io/name: orbitd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orbitd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbitd
    spec:
      containers:
        - name: orbitd
          image: orbit/orbitd:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: orbit-config
          env:
            - name: ORBIT_LISTEN_ADDRESS
              value: "0.0.0.0:50051"
            - name: ORBIT_METRICS_ADDRESS
              value: "0.0.0.0:9090"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orbitd
  namespace: orbit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: orbitd
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      nodePort: 30551
    - name: metrics
      port: 9090
      targetPort: 9090
